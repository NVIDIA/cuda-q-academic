<svg xmlns="http://www.w3.org/2000/svg" width="1468" height="326" viewBox="0 0 1468 326" role="img" aria-labelledby="title desc">
  <title id="title">Codex CLI permissions menu</title>
  <desc id="desc">The Codex CLI model permissions menu showing Ask for approval, Approve for me, and Full Access options, with Approve for me highlighted.</desc>
  <rect width="1468" height="326" fill="#ffffff"/>
  <g font-family="'Courier New', monospace" font-size="13" fill="#111">
    <rect x="22" y="23" width="280" height="76" rx="3" fill="#fafafa" stroke="#777"/>
    <text x="32" y="43">>_ <tspan font-weight="700">OpenAI Codex</tspan> <tspan fill="#6d5d7d">(v0.142.2)</tspan></text>
    <text x="32" y="73" fill="#6d5d7d">model:</text>
    <text x="109" y="73" font-weight="700">gpt-5.5</text>
    <text x="180" y="73" fill="#0086a8">/model</text>
    <text x="239" y="73" fill="#6d5d7d">to change</text>
    <text x="32" y="90" fill="#6d5d7d">directory:</text>
    <text x="109" y="90" font-weight="700">~/cuda-q-academic</text>

    <text x="32" y="132" font-weight="700">Tip:</text>
    <text x="69" y="132">GPT-5.5 is now available in Codex. It's our strongest agentic coding model yet, built to reason through large codebases, check assumptions with tools, and keep going until the work is done.</text>
    <text x="32" y="164">Learn more: https://openai.com/index/introducing-gpt-5-5/</text>

    <rect x="0" y="181" width="1468" height="105" fill="#eeeeee"/>
    <text x="32" y="208" font-weight="700">Update Model Permissions</text>
    <text x="18" y="238">›</text>
    <text x="32" y="238" fill="#005f9e">1. Ask for approval (current)</text>
    <text x="249" y="238" fill="#005f9e" font-weight="700">Codex can read and edit files in the current workspace, and run commands. Approval is required to access the internet or edit other files.</text>
    <text x="32" y="254" fill="#111">2. Approve for me</text>
    <text x="249" y="254" fill="#6d5d7d">Only ask for actions detected as potentially unsafe.</text>
    <text x="32" y="270" fill="#111">3. Full Access</text>
    <text x="249" y="270" fill="#6d5d7d">Codex can edit files outside this workspace and access the internet without asking for approval. Exercise caution when using.</text>
    <text x="32" y="299" fill="#6d5d7d">Press enter to confirm or esc to go back</text>
  </g>
  <path d="M16 250 C6 249 4 258 5 269 C5 287 2 300 4 324" fill="none" stroke="#f11" stroke-width="5" stroke-linecap="round"/>
  <path d="M16 250 C21 244 25 246 24 252" fill="none" stroke="#f11" stroke-width="5" stroke-linecap="round"/>
</svg>
