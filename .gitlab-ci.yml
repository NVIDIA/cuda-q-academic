# .gitlab-ci.yml
 
default:
  image:
    name: ghcr.io/nvidia/cudaqx
    entrypoint: [""]
 
variables:
  PIP_ROOT_USER_ACTION: ignore
  PYTHONUNBUFFERED: "1"
  GIT_DEPTH: "0"
 
stages:
  - test
 
.test:notebooks:
  stage: test
  timeout: 90 minutes
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgfortran5
    - pip install --quiet --upgrade
        jupyter
        nbconvert
        qutip
        pyscf
        genQC
        galois
        torch
        scikit-learn
        matplotlib-venn
    # The cudaqx image owns the CUDA-Q installation. Install the replacement
    # algorithms package without resolving cudaq again and potentially
    # replacing the image's curated runtime.
    - pip install --quiet --upgrade --no-deps cudaq-algorithms
    - python -c 'from importlib.metadata import version; import cudaq_algorithms; print("cudaq-algorithms", version("cudaq-algorithms"))'
    # Transitional fallback for branches that have not yet migrated every
    # import. This becomes a no-op once cudaq_solvers is gone from the repo.
    - |
      if git grep -q -E '(import|from) cudaq_solvers' -- '*.py' '*.ipynb'; then
        echo "Legacy cudaq_solvers imports found; installing compatibility package."
        pip install --quiet --upgrade --no-deps cudaq-solvers
      fi
  script:
    - |
      set -u

      mapfile -t MODULES < <(
        printf '%s\n' "$NOTEBOOK_MODULES" | sed '/^[[:space:]]*$/d'
      )

      if [ "${REQUIRE_GPU:-false}" = "true" ]; then
        if ! command -v nvidia-smi >/dev/null 2>&1; then
          echo "ERROR: GPU notebook job requires nvidia-smi, but it is not available."
          exit 1
        fi
        nvidia-smi
      fi
 
      # -----------------------------------------------------------------------
      # Restrict the job's module list to the directories affected by this
      # commit. GitLab's rules:changes prevents the job from being created at
      # all unless a notebook belonging to this CPU/GPU group changed.
      #
      #   - On default-branch pushes: run this job's group
      #   - On branch pushes / MRs: run only modules whose directory changed,
      #     plus all modules if .gitlab-ci.yml itself changed
      # -----------------------------------------------------------------------
      if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ]; then
        echo "Running all modules (trigger: ${CI_PIPELINE_SOURCE:-unknown})"
      else
        if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
          CHANGED=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD || true)
        else
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
        fi
        echo "Changed files:"
        echo "$CHANGED" | sed 's/^/  /'
      
        if echo "$CHANGED" | grep -qE "^\.gitlab-ci\.yml$"; then
          echo ".gitlab-ci.yml changed — running all modules."
        else
          FILTERED=()
          for entry in "${MODULES[@]}"; do
            IFS='|' read -r MODULE _ _ <<< "$entry"
            if echo "$CHANGED" | grep -qE "^${MODULE}/"; then
              FILTERED+=("$entry")
            fi
          done
          MODULES=("${FILTERED[@]}")
        fi
      fi
 
      if [ "${#MODULES[@]}" -eq 0 ]; then
        echo "No modules to run."
        exit 0
      fi
 
      # -----------------------------------------------------------------------
      # Execute each module's notebooks
      # -----------------------------------------------------------------------
      TOTAL_PASSED=0
      TOTAL_FAILED=0
      ALL_FAILED=()
 
      for entry in "${MODULES[@]}"; do
        IFS='|' read -r MODULE SOLUTIONS_PATH PATTERN <<< "$entry"
 
        echo "================================"
        echo "Module         : $MODULE"
        echo "Solutions path : $SOLUTIONS_PATH"
        echo "Pattern        : $PATTERN"
        echo "================================"
 
        if [ ! -d "$SOLUTIONS_PATH" ]; then
          echo "SKIP: directory '$SOLUTIONS_PATH' does not exist"
          continue
        fi
 
        mapfile -t NOTEBOOKS < <(find "$SOLUTIONS_PATH" -maxdepth 1 -name "$PATTERN" | sort)
 
        if [ "${#NOTEBOOKS[@]}" -eq 0 ]; then
          echo "SKIP: no notebooks matching '$PATTERN' in '$SOLUTIONS_PATH'"
          continue
        fi
 
        for nb in "${NOTEBOOKS[@]}"; do
          echo "▶ $nb"
          if PYTHONPATH="$PWD/$MODULE:${PYTHONPATH:-}" jupyter nbconvert \
               --to notebook \
               --execute \
               --inplace \
               --ExecutePreprocessor.timeout=1800 \
               --ExecutePreprocessor.kernel_name=python3 \
               "$nb"; then
            echo "PASS: $nb"
            TOTAL_PASSED=$((TOTAL_PASSED + 1))
          else
            echo "FAIL: $nb"
            TOTAL_FAILED=$((TOTAL_FAILED + 1))
            ALL_FAILED+=("$nb")
          fi
        done
      done
 
      echo "================================"
      echo "Summary:"
      echo "  Passed : $TOTAL_PASSED"
      echo "  Failed : $TOTAL_FAILED"
 
      if [ "$TOTAL_FAILED" -gt 0 ]; then
        echo "Failed notebooks:"
        printf '  %s\n' "${ALL_FAILED[@]}"
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 1 week

test:notebooks:cpu:
  extends: .test:notebooks
  variables:
    NOTEBOOK_MODULES: |
      quick-start-to-quantum|quick-start-to-quantum/solutions|*.ipynb
      qis-examples|qis-examples/solutions|*.ipynb
      hybrid-workflows|hybrid-workflows/solutions|*.ipynb
      qaoa-for-max-cut|qaoa-for-max-cut|*Solution*.ipynb
      quantum-applications-to-finance|quantum-applications-to-finance/solutions|*.ipynb
      dynamics101|dynamics101/Solutions|*.ipynb
      ai-for-quantum|ai-for-quantum/solutions|*.ipynb
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        paths:
          - quick-start-to-quantum/**/*.ipynb
          - qis-examples/**/*.ipynb
          - hybrid-workflows/**/*.ipynb
          - qaoa-for-max-cut/**/*.ipynb
          - quantum-applications-to-finance/**/*.ipynb
          - dynamics101/**/*.ipynb
          - ai-for-quantum/**/*.ipynb
  artifacts:
    when: always
    paths:
      - "quick-start-to-quantum/solutions/*.ipynb"
      - "qis-examples/solutions/*.ipynb"
      - "hybrid-workflows/solutions/*.ipynb"
      - "qaoa-for-max-cut/*Solution*.ipynb"
      - "quantum-applications-to-finance/solutions/*.ipynb"
      - "dynamics101/Solutions/*.ipynb"
      - "ai-for-quantum/solutions/*.ipynb"
    expire_in: 1 week

test:notebooks:gpu:
  extends: .test:notebooks
  variables:
    REQUIRE_GPU: "true"
    NOTEBOOK_MODULES: |
      chemistry-simulations|chemistry-simulations/solutions|*.ipynb
      qec101|qec101/Solutions|*.ipynb
      simulation|simulation/solutions|*.ipynb
      quantum-machine-learning-and-data-analysis|quantum-machine-learning-and-data-analysis/solutions|*.ipynb
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        paths:
          - chemistry-simulations/**/*.ipynb
          - qec101/**/*.ipynb
          - simulation/**/*.ipynb
          - quantum-machine-learning-and-data-analysis/**/*.ipynb
  artifacts:
    when: always
    paths:
      - "chemistry-simulations/solutions/*.ipynb"
      - "qec101/Solutions/*.ipynb"
      - "simulation/solutions/*.ipynb"
      - "quantum-machine-learning-and-data-analysis/solutions/*.ipynb"
    expire_in: 1 week

include:
  - project: agentics/bootstrapper
    file: gitlab/pipeline-analysis/template.yml

"🔍 AI Failure Analysis":
  extends:
    - .ai-failure-analysis
