# .gitlab-ci.yml
 
default:
  image:
    name: ghcr.io/nvidia/cudaqx
    entrypoint: [""]
 
variables:
  PIP_ROOT_USER_ACTION: ignore
  PYTHONUNBUFFERED: "1"
  GIT_DEPTH: "0"
  # Kernels spawned by nbconvert inherit this. Without it a native crash
  # (segfault, abort) shows up only as "Kernel died" with no traceback.
  PYTHONFAULTHANDLER: "1"
 
stages:
  - test
 
.test:notebooks:
  stage: test
  timeout: 90 minutes
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgfortran5
    - pip install --quiet --upgrade
        jupyter
        nbconvert
        qutip
        pyscf
        genQC
        galois
        torch
        scikit-learn
        matplotlib-venn
        pandas
    # The cudaqx image owns the CUDA-Q installation. Install the replacement
    # algorithms package without resolving cudaq again and potentially
    # replacing the image's curated runtime.
    - pip install --quiet --upgrade --no-deps cudaq-algorithms
    - python -c 'from importlib.metadata import version; import cudaq_algorithms; print("cudaq-algorithms", version("cudaq-algorithms"))'
    # Transitional fallback for branches that have not yet migrated every
    # import. This becomes a no-op once cudaq_solvers is gone from the repo.
    - |
      if git grep -q -E '(import|from) cudaq_solvers' -- '*.py' '*.ipynb'; then
        echo "Legacy cudaq_solvers imports found; installing compatibility package."
        pip install --quiet --upgrade --no-deps cudaq-solvers
      fi
    # Record the CUDA-adjacent wheel set so version drift is visible in the log.
    - pip list 2>/dev/null | grep -Ei '^(torch|numpy|scipy|cudaq|cuquantum|custatevec|cutensornet|nvidia-)' || true
    # Fail fast, with a Python traceback, if the torch + CUDA-Q combination
    # cannot coexist in one process. Both import orders are exercised because
    # notebooks import torch first; a difference between the two pins the cause.
    # -----------------------------------------------------------------------
    # GPU selection happens HERE, not in `script:`, so that every probe below
    # runs against exactly the same set of visible devices the notebooks get.
    # before_script and script share one shell, so the export carries over.
    # Previously the probes saw all 8 GPUs while the notebooks saw 2, which
    # meant a passing probe said nothing about the notebook environment.
    # -----------------------------------------------------------------------
    - |
      if [ "${REQUIRE_GPU:-false}" = "true" ]; then
        if ! command -v nvidia-smi >/dev/null 2>&1; then
          echo "ERROR: GPU notebook job requires nvidia-smi, but it is not available."
          exit 1
        fi
        nvidia-smi
        # Expose the top NOTEBOOK_GPU_COUNT (default 2) GPUs by free memory:
        # the mqpu notebooks dispatch to qpu_id 0 and 1 and fail with a single
        # visible device.
        NOTEBOOK_GPU_COUNT="${NOTEBOOK_GPU_COUNT:-2}"
        FREE_GPUS=$(nvidia-smi --query-gpu=index,memory.free \
          --format=csv,noheader,nounits \
          | sort -t, -k2 -nr | head -n "$NOTEBOOK_GPU_COUNT" \
          | cut -d, -f1 | tr -d ' ' | paste -sd,)
        export CUDA_VISIBLE_DEVICES=$FREE_GPUS
        echo "Selected GPUs $FREE_GPUS (most free memory, ${NOTEBOOK_GPU_COUNT} requested)"
      fi
    # -----------------------------------------------------------------------
    # Container limits. A silent "Kernel died" with no faulthandler traceback
    # is the signature of an external SIGKILL (cgroup OOM), not a segfault,
    # so record the memory ceiling the kernels are actually running under.
    # -----------------------------------------------------------------------
    - |
      echo "--- container memory limits"
      for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.high \
               /sys/fs/cgroup/memory/memory.limit_in_bytes; do
        [ -r "$f" ] && echo "  $f = $(cat "$f")"
      done
      free -g 2>/dev/null || true
    - |
      if [ "${REQUIRE_GPU:-false}" = "true" ]; then
        echo "--- smoke (fatal): import torch, then cudaq, select nvidia target"
        python -X faulthandler -c '
      import torch, cudaq
      print("torch", torch.__version__, "cuda", torch.version.cuda, "available", torch.cuda.is_available())
      print("cudaq", cudaq.__version__, "gpus", cudaq.num_available_gpus())
      cudaq.set_target("nvidia")
      print("torch-first import order ok")
      '
        echo "--- smoke (fatal): import cudaq, then torch"
        python -X faulthandler -c '
      import cudaq, torch
      cudaq.set_target("nvidia")
      print("cudaq-first import order ok")
      '
        # -------------------------------------------------------------------
        # The probes below are non-fatal: they are here to pin the crash, not
        # to gate the job. Each one mirrors something a failing notebook does
        # that the earlier bare import probes did NOT cover.
        # -------------------------------------------------------------------

        # simulation/01 does not merely switch targets, it runs a circuit on
        # each one. Switching with live simulator state is the untested path.
        echo "--- probe (non-fatal): switch targets WITH a circuit on each"
        python -X faulthandler -c '
      import cudaq
      @cudaq.kernel
      def ghz(n: int):
          reg = cudaq.qvector(n)
          h(reg[0])
          for i in range(n - 1):
              x.ctrl(reg[i], reg[i + 1])
      for t in ("nvidia", "tensornet", "nvidia", "tensornet", "stim"):
          cudaq.reset_target(); cudaq.set_target(t)
          cudaq.sample(ghz, 12)
          print("  ran a circuit on", cudaq.get_target().name, flush=True)
      print("target switching with circuits ok")
      ' || echo "WARN: target switching with live circuits crashed (see above)"

        # The two failing QML notebooks are the only ones importing torch.
        # Exercise torch on the GPU and cudaq on the GPU in one process, which
        # the import-only probes never did.
        echo "--- probe (non-fatal): torch CUDA tensor + cudaq nvidia in one process"
        python -X faulthandler -c '
      import torch, cudaq
      dev = torch.device("cuda:0")
      t = torch.randn(1024, 1024, device=dev) @ torch.randn(1024, 1024, device=dev)
      torch.cuda.synchronize()
      print("  torch CUDA matmul ok, sum", float(t.sum()), flush=True)
      cudaq.set_target("nvidia")
      @cudaq.kernel
      def bell():
          q = cudaq.qvector(2)
          h(q[0])
          x.ctrl(q[0], q[1])
      print("  cudaq sample after torch CUDA:", cudaq.sample(bell, shots_count=100).most_probable(), flush=True)
      print("  cudaq observe after torch CUDA:", cudaq.observe(bell, cudaq.spin.z(0) * cudaq.spin.z(1)).expectation(), flush=True)
      t2 = torch.randn(512, 512, device=dev).sum()
      torch.cuda.synchronize()
      print("  torch CUDA still alive after cudaq:", float(t2), flush=True)
      print("torch + cudaq GPU interop ok")
      ' || echo "WARN: torch + cudaq GPU interop crashed (see above)"

        # Same interop, but inside a real ipykernel under nbconvert. If this
        # crashes while the plain-python probe above passes, the trigger is
        # the kernel process itself (ZMQ/stdio/threading), not the libraries.
        echo "--- probe (non-fatal): same interop inside an ipykernel"
        python -c '
      import json, pathlib
      src = "\n".join([
          "import torch, cudaq",
          "print(\"torch cuda\", torch.cuda.is_available(), flush=True)",
          "acc = torch.randn(512, 512, device=\"cuda:0\").sum()",
          "torch.cuda.synchronize()",
          "cudaq.set_target(\"nvidia\")",
          "@cudaq.kernel",
          "def bell():",
          "    q = cudaq.qvector(2)",
          "    h(q[0])",
          "    x.ctrl(q[0], q[1])",
          "print(\"sample\", cudaq.sample(bell, shots_count=100).most_probable(), flush=True)",
          "print(\"kernel-mode interop ok\", float(acc), flush=True)",
      ])
      nb = {
          "cells": [{"cell_type": "code", "id": "probe", "metadata": {},
                     "source": src, "outputs": [], "execution_count": None}],
          "metadata": {
              "kernelspec": {"name": "python3", "display_name": "python3",
                             "language": "python"},
              "language_info": {"name": "python"},
          },
          "nbformat": 4, "nbformat_minor": 5,
      }
      pathlib.Path("/tmp/_interop_probe.ipynb").write_text(json.dumps(nb))
      '
        jupyter nbconvert --to notebook --execute --inplace \
          --ExecutePreprocessor.timeout=300 \
          /tmp/_interop_probe.ipynb \
          && echo "ipykernel interop probe ok" \
          || echo "WARN: ipykernel interop probe crashed (see above)"
      fi
  script:
    - |
      set -u

      mapfile -t MODULES < <(
        printf '%s\n' "$NOTEBOOK_MODULES" | sed '/^[[:space:]]*$/d'
      )

      # GPU selection and CUDA_VISIBLE_DEVICES now happen in before_script,
      # so the smoke probes and the notebooks share one device configuration.
      if [ "${REQUIRE_GPU:-false}" = "true" ]; then
        echo "Notebooks will run with CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-<unset>}"
      fi

      mkdir -p "$CI_PROJECT_DIR/nb-logs"

      # -----------------------------------------------------------------------
      # post_mortem <notebook> <module>
      #
      # nbconvert reports a dead kernel as a bare DeadKernelError: the kernel's
      # own crash output is lost because nbclient tears the process down before
      # anything is flushed. Re-run the same code as a plain script under
      # `python -X faulthandler` (no ZMQ, no kernel indirection) so a native
      # crash prints a real traceback pointing at the offending line, and
      # record whether the kernel was killed from outside instead.
      # -----------------------------------------------------------------------
      post_mortem() {
        local nb="$1" mod="$2"
        local base; base=$(basename "$nb" .ipynb)
        echo "--- post-mortem: $nb"

        echo "  cgroup memory events (non-zero oom_kill == the kernel was OOM-killed):"
        for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak \
                 /sys/fs/cgroup/memory/memory.failcnt; do
          [ -r "$f" ] && sed 's/^/    /' "$f"
        done
        if dmesg -T >/dev/null 2>&1; then
          dmesg -T | grep -iE 'oom|killed process' | tail -20 | sed 's/^/    /'
        else
          echo "    (dmesg unavailable in this container)"
        fi

        echo "  GPU state after the crash:"
        nvidia-smi --query-gpu=index,memory.used,memory.total --format=csv 2>/dev/null \
          | sed 's/^/    /' || true

        echo "  re-running as a plain script with faulthandler enabled:"
        local script="$CI_PROJECT_DIR/nb-logs/${base}.py"
        if jupyter nbconvert --to script --output-dir "$CI_PROJECT_DIR/nb-logs" \
             --output "$base" "$nb" >/dev/null 2>&1; then
          # nbconvert renders notebook magics as get_ipython() calls, which do
          # not exist outside a kernel. Stub it so the script fails at the real
          # crash rather than at a NameError.
          printf '%s\n' \
            'import faulthandler, sys; faulthandler.enable(all_threads=True)' \
            'def get_ipython():' \
            '    class _Shim:' \
            '        def __getattr__(self, _): return lambda *a, **k: None' \
            '    return _Shim()' \
            | cat - "$script" > "${script}.tmp" && mv "${script}.tmp" "$script"
          ( cd "$(dirname "$nb")" \
            && PYTHONPATH="$CI_PROJECT_DIR/$mod:${PYTHONPATH:-}" \
               timeout 1800 python -X faulthandler -u "$script" ) \
            > "$CI_PROJECT_DIR/nb-logs/${base}.postmortem.log" 2>&1
          local rc=$?
          echo "  plain-script exit code: $rc"
          if [ "$rc" -gt 128 ]; then
            echo "  -> killed by signal $((rc - 128)) (137=SIGKILL/OOM, 139=SIGSEGV, 134=SIGABRT)"
          fi
          echo "  last 60 lines of plain-script output:"
          tail -n 60 "$CI_PROJECT_DIR/nb-logs/${base}.postmortem.log" | sed 's/^/    /'
        else
          echo "  (could not convert notebook to script)"
        fi
        echo "--- end post-mortem: $nb"
      }

      # -----------------------------------------------------------------------
      # Restrict the job's module list to the directories affected by this
      # commit. GitLab's rules:changes prevents the job from being created at
      # all unless a notebook belonging to this CPU/GPU group changed.
      #
      #   - On default-branch pushes: run this job's group
      #   - On branch pushes / MRs: run only modules whose directory changed,
      #     plus all modules if .gitlab-ci.yml itself changed
      # -----------------------------------------------------------------------
      echo "CI_COMMIT_BRANCH=${CI_COMMIT_BRANCH:-<unset>} CI_DEFAULT_BRANCH=${CI_DEFAULT_BRANCH:-<unset>} CI_PIPELINE_SOURCE=${CI_PIPELINE_SOURCE:-<unset>}"
      if [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH:-main}" ]; then
        echo "Running all modules (trigger: ${CI_PIPELINE_SOURCE:-unknown})"
      else
        if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
          CHANGED=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD || true)
        else
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
        fi
        echo "Changed files:"
        echo "$CHANGED" | sed 's/^/  /'
      
        if echo "$CHANGED" | grep -qE "^\.gitlab-ci\.yml$"; then
          echo ".gitlab-ci.yml changed — running all modules."
        else
          FILTERED=()
          for entry in "${MODULES[@]}"; do
            IFS='|' read -r MODULE _ _ <<< "$entry"
            if echo "$CHANGED" | grep -qE "^${MODULE}/"; then
              FILTERED+=("$entry")
            fi
          done
          MODULES=("${FILTERED[@]}")
        fi
      fi
 
      if [ "${#MODULES[@]}" -eq 0 ]; then
        echo "No modules to run."
        exit 0
      fi
 
      # -----------------------------------------------------------------------
      # Execute each module's notebooks
      # -----------------------------------------------------------------------
      TOTAL_PASSED=0
      TOTAL_FAILED=0
      ALL_FAILED=()
 
      for entry in "${MODULES[@]}"; do
        IFS='|' read -r MODULE SOLUTIONS_PATH PATTERN <<< "$entry"
 
        echo "================================"
        echo "Module         : $MODULE"
        echo "Solutions path : $SOLUTIONS_PATH"
        echo "Pattern        : $PATTERN"
        echo "================================"
 
        if [ ! -d "$SOLUTIONS_PATH" ]; then
          echo "SKIP: directory '$SOLUTIONS_PATH' does not exist"
          continue
        fi
 
        mapfile -t NOTEBOOKS < <(find "$SOLUTIONS_PATH" -maxdepth 1 -name "$PATTERN" | sort)
 
        if [ "${#NOTEBOOKS[@]}" -eq 0 ]; then
          echo "SKIP: no notebooks matching '$PATTERN' in '$SOLUTIONS_PATH'"
          continue
        fi
 
        for nb in "${NOTEBOOKS[@]}"; do
          echo "▶ $nb"
          if PYTHONPATH="$PWD/$MODULE:${PYTHONPATH:-}" jupyter nbconvert \
               --to notebook \
               --execute \
               --inplace \
               --ExecutePreprocessor.timeout=1800 \
               --ExecutePreprocessor.kernel_name=python3 \
               "$nb"; then
            echo "PASS: $nb"
            TOTAL_PASSED=$((TOTAL_PASSED + 1))
          else
            echo "FAIL: $nb"
            TOTAL_FAILED=$((TOTAL_FAILED + 1))
            ALL_FAILED+=("$nb")
            post_mortem "$nb" "$MODULE" || true
          fi
        done
      done
 
      echo "================================"
      echo "Summary:"
      echo "  Passed : $TOTAL_PASSED"
      echo "  Failed : $TOTAL_FAILED"
 
      if [ "$TOTAL_FAILED" -gt 0 ]; then
        echo "Failed notebooks:"
        printf '  %s\n' "${ALL_FAILED[@]}"
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 1 week

test:notebooks:cpu:
  extends: .test:notebooks
  variables:
    NOTEBOOK_MODULES: |
      quick-start-to-quantum|quick-start-to-quantum/solutions|*.ipynb
      qis-examples|qis-examples/solutions|*.ipynb
      hybrid-workflows|hybrid-workflows/solutions|*.ipynb
      qaoa-for-max-cut|qaoa-for-max-cut|*Solution*.ipynb
      quantum-applications-to-finance|quantum-applications-to-finance/solutions|*.ipynb
      dynamics101|dynamics101/Solutions|*.ipynb
      ai-for-quantum|ai-for-quantum/solutions|*.ipynb
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        paths:
          - quick-start-to-quantum/**/*.ipynb
          - qis-examples/**/*.ipynb
          - hybrid-workflows/**/*.ipynb
          - qaoa-for-max-cut/**/*.ipynb
          - quantum-applications-to-finance/**/*.ipynb
          - dynamics101/**/*.ipynb
          - ai-for-quantum/**/*.ipynb
  artifacts:
    when: always
    paths:
      - "quick-start-to-quantum/solutions/*.ipynb"
      - "qis-examples/solutions/*.ipynb"
      - "hybrid-workflows/solutions/*.ipynb"
      - "qaoa-for-max-cut/*Solution*.ipynb"
      - "quantum-applications-to-finance/solutions/*.ipynb"
      - "dynamics101/Solutions/*.ipynb"
      - "ai-for-quantum/solutions/*.ipynb"
      # Crash post-mortems for notebooks whose kernel died.
      - "nb-logs/"
    expire_in: 1 week

test:notebooks:gpu:
  extends: .test:notebooks
  variables:
    REQUIRE_GPU: "true"
    NOTEBOOK_MODULES: |
      chemistry-simulations|chemistry-simulations/solutions|*.ipynb
      qec101|qec101/Solutions|*.ipynb
      simulation|simulation/solutions|*.ipynb
      quantum-machine-learning-and-data-analysis|quantum-machine-learning-and-data-analysis/solutions|*.ipynb
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        paths:
          - chemistry-simulations/**/*.ipynb
          - qec101/**/*.ipynb
          - simulation/**/*.ipynb
          - quantum-machine-learning-and-data-analysis/**/*.ipynb
  artifacts:
    when: always
    paths:
      - "chemistry-simulations/solutions/*.ipynb"
      - "qec101/Solutions/*.ipynb"
      - "simulation/solutions/*.ipynb"
      - "quantum-machine-learning-and-data-analysis/solutions/*.ipynb"
      # Crash post-mortems for notebooks whose kernel died.
      - "nb-logs/"
    expire_in: 1 week

include:
  - project: agentics/bootstrapper
    file: gitlab/pipeline-analysis/template.yml

"🔍 AI Failure Analysis":
  extends:
    - .ai-failure-analysis
