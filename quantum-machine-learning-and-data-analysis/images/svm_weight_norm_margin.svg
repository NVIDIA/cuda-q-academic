<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">A smaller SVM weight norm produces a wider canonical margin</title>
  <desc id="desc">Canonical score is plotted against perpendicular distance from the decision boundary. A steep blue line with larger weight norm reaches score one after a short distance. A shallow green line with smaller weight norm reaches score one after a longer distance. Therefore the half-margin equals one divided by the weight norm.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#374151"/>
    </marker>
    <style>
      .axis-label{font:500 15px Arial,Helvetica,sans-serif;fill:#4B5563}
      .tick{font:600 15px Arial,Helvetica,sans-serif;fill:#B66F08}
      .margin{font:600 15px Arial,Helvetica,sans-serif;fill:#374151}
      .ray-label{font:600 16px Arial,Helvetica,sans-serif}
      .equation{font:600 21px Arial,Helvetica,sans-serif;fill:#1F2937}
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#F8FAFC"/>

  <!-- Axes: the canonical boundary is the shared origin. -->
  <line x1="142" y1="318" x2="1110" y2="318" stroke="#374151" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <line x1="150" y1="326" x2="150" y2="48" stroke="#374151" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="1105" y="345" class="axis-label" text-anchor="end">perpendicular distance from boundary</text>
  <text x="62" y="60" class="axis-label" transform="rotate(-90 62 60)" text-anchor="end">canonical score</text>

  <!-- Both models must reach the same canonical score of one. -->
  <line x1="150" y1="92" x2="1060" y2="92" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/>
  <text x="126" y="98" class="tick" text-anchor="end">score = 1</text>

  <!-- Larger norm: score changes quickly, so the margin is short. -->
  <line x1="150" y1="318" x2="430" y2="92" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="430" cy="92" r="7" fill="#3B82F6" stroke="#F8FAFC" stroke-width="3"/>
  <line x1="430" y1="104" x2="430" y2="318" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 7" opacity=".42"/>
  <line x1="430" y1="312" x2="430" y2="324" stroke="#374151" stroke-width="2"/>
  <text x="409" y="145" class="ray-label" fill="#2563EB" text-anchor="end">larger ‖w‖</text>
  <text x="430" y="345" class="margin" text-anchor="middle">m<tspan baseline-shift="sub" font-size="11">small</tspan></text>

  <!-- Smaller norm: score changes slowly, so the margin is wide. -->
  <line x1="150" y1="318" x2="980" y2="92" stroke="#76B900" stroke-width="5" stroke-linecap="round"/>
  <circle cx="980" cy="92" r="7" fill="#76B900" stroke="#F8FAFC" stroke-width="3"/>
  <line x1="980" y1="104" x2="980" y2="318" stroke="#76B900" stroke-width="1.5" stroke-dasharray="2 7" opacity=".42"/>
  <line x1="980" y1="312" x2="980" y2="324" stroke="#374151" stroke-width="2"/>
  <text x="795" y="177" class="ray-label" fill="#568700">smaller ‖w‖</text>
  <text x="980" y="345" class="margin" text-anchor="middle">m<tspan baseline-shift="sub" font-size="11">large</tspan></text>

  <text x="600" y="395" class="equation" text-anchor="middle">
    m = 1/‖w‖ <tspan fill="#9CA3AF">·</tspan> <tspan fill="#568700">smaller ‖w‖ → wider margin</tspan>
  </text>
</svg>
