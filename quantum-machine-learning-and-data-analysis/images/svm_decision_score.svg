<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SVM decision score across a linear boundary</title>
  <desc id="desc">A clean two-dimensional feature space is divided by a vertical boundary where g of x equals zero. Blue point A lies in the negative-score region and is predicted minus one. Orange point B lies in the positive-score region and is predicted plus one. A short green vector w points perpendicular to the boundary.</desc>
  <defs>
    <clipPath id="plot-clip">
      <rect x="92" y="34" width="1016" height="338" rx="20"/>
    </clipPath>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#76B900"/>
    </marker>
    <style>
      .axis-label{font:500 15px Inter,Arial,sans-serif;fill:#64748B}
      .boundary-label{font:600 16px Inter,Arial,sans-serif;fill:#0F172A}
      .point-label{font:700 17px Inter,Arial,sans-serif;fill:#FFFFFF}
      .score{font:600 18px Inter,Arial,sans-serif;fill:#0F172A}
      .vector-label{font:700 italic 17px Georgia,serif;fill:#4D7A00}
    </style>
  </defs>

  <rect width="1200" height="420" fill="#F8FAFC"/>
  <rect x="92" y="34" width="1016" height="338" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <g clip-path="url(#plot-clip)">
    <rect x="93" y="35" width="507" height="336" fill="#3B82F6" opacity="0.075"/>
    <rect x="600" y="35" width="507" height="336" fill="#F59E0B" opacity="0.085"/>
  </g>

  <line x1="132" y1="338" x2="1070" y2="338" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="148" y1="354" x2="148" y2="72" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1060" y="362" class="axis-label">x₁</text>
  <text x="126" y="79" class="axis-label">x₂</text>

  <line x1="600" y1="57" x2="600" y2="354" stroke="#0F172A" stroke-width="3"/>
  <rect x="546" y="52" width="108" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="600" y="74" text-anchor="middle" class="boundary-label">g(x) = 0</text>

  <line x1="600" y1="112" x2="704" y2="112" stroke="#76B900" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <path d="M600 126H614V112" fill="none" stroke="#76B900" stroke-width="2"/>
  <text x="650" y="100" text-anchor="middle" class="vector-label">w</text>

  <g filter="url(#soft-shadow)">
    <rect x="238" y="132" width="202" height="48" rx="14" fill="#FFFFFF" stroke="#BFDBFE"/>
    <path d="M337 180L354 204L371 180Z" fill="#FFFFFF" stroke="#BFDBFE" stroke-linejoin="round"/>
  </g>
  <text x="339" y="162" text-anchor="middle" class="score">g(A) &lt; 0  →  −1</text>
  <circle cx="354" cy="229" r="17" fill="#3B82F6" stroke="#FFFFFF" stroke-width="4" filter="url(#soft-shadow)"/>
  <text x="354" y="235" text-anchor="middle" class="point-label">A</text>

  <g filter="url(#soft-shadow)">
    <rect x="758" y="192" width="202" height="48" rx="14" fill="#FFFFFF" stroke="#FDE68A"/>
    <path d="M842 240L859 264L876 240Z" fill="#FFFFFF" stroke="#FDE68A" stroke-linejoin="round"/>
  </g>
  <text x="859" y="222" text-anchor="middle" class="score">g(B) &gt; 0  →  +1</text>
  <circle cx="859" cy="289" r="17" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4" filter="url(#soft-shadow)"/>
  <text x="859" y="295" text-anchor="middle" class="point-label">B</text>
</svg>
