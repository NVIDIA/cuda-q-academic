services:
  cuda-q-academic:
    image: ghcr.io/nvidia/cudaqx
    ports:
      - '8888:8888'
    command: >-
          -c "pip install qutip torch scikit-learn matplotlib-venn cudaq-algorithms tornado==6.5.10 &&
          cd /home/cudaq &&
          git clone https://github.com/NVIDIA/cuda-q-academic &&
          git clone --filter=blob:none --sparse https://github.com/NVIDIA/cuda-quantum /tmp/sparse-repo &&
          cd /tmp/sparse-repo &&
          git sparse-checkout set docs/sphinx/applications/python &&
          cp -r docs/sphinx/applications/python /home/cudaq/cuda-q-academic/application-hub &&
          cd /home/cudaq &&
          jupyter lab --ip=0.0.0.0 --no-browser --NotebookApp.token='' --allow-root --NotebookApp.allow_origin='*' --notebook-dir='/home/cudaq/cuda-q-academic'"
